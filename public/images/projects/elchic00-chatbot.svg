<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="cb-t cb-d">
  <title id="cb-t">AI Chat Assistant — no retrieval, one whole portfolio file per request</title>
  <desc id="cb-d">Two request paths. The usual build — question, chunk, embed, vector search, Gemini — is drawn faded and struck through. What ships: the question and one whole structured portfolio file go straight to Gemini on every message, with zero vector databases.</desc>
  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#0a1024"/></linearGradient>
    <marker id="cbA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="700" height="400" fill="url(#cbBg)"/>
  <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="2" fill="#6b8fc4">EVERY CHAT MESSAGE</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" text-anchor="middle">
    <text x="40" y="96" font-size="20" fill="#71809c" text-anchor="start">the usual build</text>
    <g fill="none" stroke="#3a4863" stroke-width="2" stroke-dasharray="6 5">
      <rect x="40" y="108" width="108" height="44" rx="8"/><rect x="168" y="108" width="108" height="44" rx="8"/><rect x="296" y="108" width="108" height="44" rx="8"/><rect x="424" y="108" width="108" height="44" rx="8"/><rect x="552" y="108" width="108" height="44" rx="8"/>
    </g>
    <g font-size="20" fill="#71809c">
      <text x="94" y="137">question</text><text x="222" y="137">chunk</text><text x="350" y="137">embed</text><text x="478" y="137">search</text><text x="606" y="137">Gemini</text>
    </g>
    <line x1="30" y1="130" x2="670" y2="130" stroke="#f87171" stroke-width="3" stroke-opacity=".6"/>

    <text x="40" y="206" font-size="20" fill="#93b4e8" text-anchor="start">what ships</text>
    <rect x="40" y="218" width="130" height="62" rx="10" fill="#0f1b33" stroke="#3b5b8f" stroke-width="2"/>
    <text x="105" y="256" font-size="22" fill="#c7d7f3">question</text>
    <line x1="176" y1="249" x2="214" y2="249" stroke="#60a5fa" stroke-width="3" marker-end="url(#cbA)"/>
    <rect x="220" y="218" width="260" height="62" rx="10" fill="#60a5fa"/>
    <text x="350" y="256" font-size="22" font-weight="700" fill="#0a1024">whole portfolio file</text>
    <line x1="486" y1="249" x2="524" y2="249" stroke="#60a5fa" stroke-width="3" marker-end="url(#cbA)"/>
    <rect x="530" y="218" width="130" height="62" rx="10" fill="#0f1b33" stroke="#3b5b8f" stroke-width="2"/>
    <text x="595" y="256" font-size="22" fill="#c7d7f3">Gemini</text>

    <text x="36" y="360" font-size="56" font-weight="800" fill="#93c5fd" text-anchor="start">0 <tspan font-size="24" font-weight="400" fill="#8ea6cc">vector databases, nothing to drift</tspan></text>
  </g>
</svg>

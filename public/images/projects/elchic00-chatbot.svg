<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="cb-t cb-d">
  <title id="cb-t">AI Chat Assistant — zero vector databases, one structured context file</title>
  <desc id="cb-d">The assistant in the corner of the portfolio. A Cloudflare Worker sends Gemini 2.5 Flash one compact structured reference for the whole site on every request, with no vector store, no chunking and no embeddings. It can also turn a reply into a real UI action. An eval question still caught a confidently wrong answer, traced to a bad source file rather than the model.</desc>
  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#0a1220"/></linearGradient>
    <pattern id="cbScan" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="1" fill="#ffffff" opacity="0.02"/></pattern>
    <filter id="cbGlow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cbBand" x="-15%" y="-70%" width="130%" height="240%"><feGaussianBlur stdDeviation="16" result="b"/><feComponentTransfer in="b" result="bt"><feFuncA type="linear" slope="0.30"/></feComponentTransfer><feMerge><feMergeNode in="bt"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#cbBg)"/>
  <rect width="1200" height="720" fill="url(#cbScan)"/>
  <g font-family="'SF Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace">
    <circle cx="112" cy="50" r="8" fill="#2b3a4f"/><circle cx="140" cy="50" r="8" fill="#2b3a4f"/><circle cx="168" cy="50" r="8" fill="#2b3a4f"/>
    <text x="1112" y="57" text-anchor="end" font-size="19" fill="#3b485d" letter-spacing="0.5">cloudflare : elchic00-chat</text>
    <line x1="72" y1="82" x2="1128" y2="82" stroke="#161f2e" stroke-width="1"/>

    <text x="118" y="150" font-size="25" fill="#3f4d63">$</text>
    <text x="150" y="150" font-size="25" fill="#f1f5f9">wrangler <tspan fill="#67e8f9">tail</tspan> <tspan fill="#7c8aa3">--format</tspan> <tspan fill="#cbd5e1">pretty</tspan></text>

    <text x="150" y="200" font-size="22" fill="#6b7c94">ctx: 1 structured file &#183; sent whole &#183; every request</text>
    <text x="150" y="236" font-size="22" fill="#6b7c94">reply &#8594; UI action: open r&#233;sum&#233;, jump to a section</text>

    <g filter="url(#cbBand)">
      <rect x="112" y="262" width="988" height="168" rx="9" fill="#0b2a34"/>
      <rect x="112" y="262" width="6" height="168" fill="#22d3ee"/>
    </g>
    <text x="152" y="364" font-size="32" fill="#94a3b8">vector databases</text>
    <text x="1058" y="386" text-anchor="end" font-size="128" font-weight="800" letter-spacing="-4" fill="#67e8f9" filter="url(#cbGlow)">0</text>

    <text x="152" y="500" font-size="23" fill="#22d3ee" opacity=".9">&#9650;  no chunking, no embeddings, no index</text>

    <text x="118" y="576" font-size="25" fill="#3f4d63">$</text>
    <rect x="150" y="554" width="16" height="30" fill="#22d3ee"><animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/></rect>

    <text x="118" y="640" font-size="20" fill="#36445a"># an eval still caught a wrong answer &#8212; bad source file, not the model</text>
  </g>
</svg>

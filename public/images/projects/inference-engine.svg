<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="ie-title ie-desc">
  <title id="ie-title">Inference Engine: one dense model, self-speculated</title>
  <desc id="ie-desc">A benchmark card showing the sole primary model, a dense Qwen 3.8 27B, breaking the memory-bandwidth wall on a local AMD APU: about 7.4 tokens per second for plain autoregressive decode, about 20 tokens per second with Multi-Token Prediction self-speculation, across three parallel 196k-context slots on the same GPU.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity=".35"/></pattern>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient>
  </defs>
  <rect width="1200" height="450" fill="url(#bg)"/><rect width="1200" height="450" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="52" y="42" width="355" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="230" y="64" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#67e8f9">GFX1151 · LLAMA.CPP (PATCHED)</text>
    <text x="1148" y="63" text-anchor="end" font-size="12" letter-spacing="1" fill="#94a3b8">FRAMEWORK DESKTOP · RYZEN AI MAX+ 395</text>
    <text x="600" y="112" text-anchor="middle" font-size="14" letter-spacing="2" fill="#94a3b8">ONE DENSE MODEL · SAME GPU · SAME QUANT</text>
    <line x1="160" y1="334" x2="1040" y2="334" stroke="#334155" stroke-width="2"/>
    <rect x="380" y="302" width="150" height="32" rx="7" fill="url(#slate)"/>
    <text x="455" y="286" text-anchor="middle" font-size="25" font-weight="800" fill="#94a3b8">7.4 t/s</text>
    <text x="455" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">NO SPECULATION</text>
    <text x="455" y="387" text-anchor="middle" font-size="11" fill="#94a3b8">BANDWIDTH FLOOR · Q8 / LPDDR5X</text>
    <rect x="670" y="170" width="150" height="164" rx="7" fill="url(#cyan)"/>
    <text x="745" y="154" text-anchor="middle" font-size="30" font-weight="800" fill="#67e8f9">~20 t/s</text>
    <text x="745" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">QWEN 3.8 27B + MTP</text>
    <text x="745" y="387" text-anchor="middle" font-size="11" fill="#94a3b8">DENSE · 3 SLOTS · 196K CTX</text>
    <text x="600" y="424" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">A measured constraint: multi-token self-speculation breaks the memory-bandwidth wall.</text>
  </g>
</svg>

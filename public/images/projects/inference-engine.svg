<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="ie-t ie-d">
  <title id="ie-t">Inference Engine — 33.2 tokens/sec through a 7.4 tokens/sec bandwidth ceiling</title>
  <desc id="ie-d">A throughput bar for the dense 27B model on structured output. Memory bandwidth caps plain decode at 7.4 tokens per second, drawn as a hatched wall. With speculative decoding the measured bar runs straight through it to 33.2 tokens per second, about 4.5 times the ceiling.</desc>
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#08141f"/></linearGradient>
    <pattern id="ieHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#f87171" stroke-width="3"/></pattern>
  </defs>
  <rect width="700" height="400" fill="url(#ieBg)"/>
  <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="2" fill="#5f8ea4">DENSE 27B DECODE · STRUCTURED OUTPUT</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="36" y="172" font-size="112" font-weight="800" letter-spacing="-4" fill="#67e8f9">33.2<tspan dx="14" font-size="38" font-weight="700" letter-spacing="0" fill="#7f9bb2">tokens/sec</tspan></text>
    <text x="40" y="214" font-size="23" fill="#8fdcea">4.5× past the memory-bandwidth ceiling</text>

    <rect x="40" y="252" width="620" height="54" rx="8" fill="#0c2530"/>
    <rect x="40" y="252" width="515" height="54" rx="8" fill="#22d3ee"/>
    <rect x="149" y="236" width="14" height="86" fill="url(#ieHatch)" opacity=".75"/>
    <rect x="149" y="236" width="14" height="86" fill="none" stroke="#f87171" stroke-width="2"/>
    <path d="M163 266l26-7M163 279l30 2M163 292l24 10" stroke="#0c2530" stroke-width="3" fill="none"/>

    <text x="40" y="352" font-size="20" fill="#5d7489">0</text>
    <text x="156" y="352" font-size="21" fill="#f59a9a" text-anchor="middle">7.4 ceiling</text>
    <text x="660" y="352" font-size="20" fill="#5d7489" text-anchor="end">40</text>
  </g>
</svg>

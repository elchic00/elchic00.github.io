<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="ie-title ie-desc">
  <title id="ie-title">Inference Engine: one dense model, self-speculated</title>
  <desc id="ie-desc">Inference engine diagram. A single dense Qwen 3.8 27B model (Q8, full 99-layer GPU offload) serves every agent on one box. The same model, same GPU, same quantization, with Multi-Token Prediction self-speculation versus plain autoregressive decoding: the 7.4 tokens-per-second memory-bandwidth floor becomes a peak of 22.35 tokens per second on structured, tool-calling prompts, with a sustained average near 10 tokens per second on everyday mixed traffic. Three parallel slots, 196k context each.</desc>
  <rect width="1200" height="450" fill="#0a0a0b"/>
  <text x="600" y="60" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">ONE DENSE MODEL · SAME GPU · SAME QUANT</text>
  <text x="600" y="88" text-anchor="middle" fill="#71717a" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">Qwen 3.8 27B — the only thing that changed is whether the MTP head gets to speculate</text>
  <rect x="120" y="130" width="190" height="110" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="215" y="170" text-anchor="middle" fill="#a1a1aa" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">DENSE</text>
  <text x="215" y="195" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">QWEN 3.8 27B</text>
  <text x="215" y="216" text-anchor="middle" fill="#71717a" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif">Q8 · 99/99 LAYERS GPU</text>
  <line x1="310" y1="172" x2="370" y2="150" stroke="#3f3f46" stroke-width="1.5"/>
  <line x1="310" y1="190" x2="370" y2="268" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="370" y="120" width="500" height="60" rx="6" fill="none"/>
  <rect x="370" y="150" width="39" height="30" rx="3" fill="#27272a"/>
  <text x="389" y="170" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">7.4</text>
  <text x="425" y="170" fill="#a1a1aa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">t/s · no speculation</text>
  <text x="890" y="170" text-anchor="end" fill="#71717a" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">← the 200 GB/s LPDDR5X wall</text>
  <rect x="370" y="240" width="500" height="60" rx="6" fill="none"/>
  <rect x="370" y="238" width="455" height="44" rx="4" fill="#27272a"/>
  <text x="384" y="266" fill="#ffffff" font-size="14" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">22.35 t/s · MTP</text>
  <text x="860" y="266" text-anchor="end" fill="#71717a" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">structured/tool-call peak · ~10 t/s avg mixed</text>
  <text x="370" y="228" fill="#a1a1aa" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">plain autoregressive — every token pays the full read</text>
  <text x="370" y="318" fill="#a1a1aa" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">MTP head drafts K tokens, main model verifies all K in one pass</text>
  <text x="600" y="380" text-anchor="middle" fill="#52525b" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">Honest limitation: self-speculation only pays off when the draft head is right —</text>
  <text x="600" y="400" text-anchor="middle" fill="#52525b" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">structured, tool-heavy prompts accept at 80%+; free-form creative drops to ~50%. Bandwidth-bound either way.</text>
  <text x="600" y="432" text-anchor="middle" fill="#71717a" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">3 parallel slots · 196k context each · nothing rented</text>
</svg>
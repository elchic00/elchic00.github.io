<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="ie-title ie-desc">
  <title id="ie-title">Inference Engine: one dense model, self-speculated</title>
  <desc id="ie-desc">Inference engine diagram. A single dense Qwen 3.8 27B model (Q8, full 99-layer GPU offload) serves every agent on one box. The same model, same GPU, same quantization, with Multi-Token Prediction self-speculation versus plain autoregressive decoding: the 7.4 tokens-per-second memory-bandwidth floor becomes a peak of 22.35 tokens per second on structured, tool-calling prompts, with a sustained average near 10 tokens per second on everyday mixed traffic. Three parallel slots, 196k context each.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="450" fill="url(#bg)"/>
  <rect width="1200" height="450" fill="url(#grid)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="600" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="#e2e8f0">ONE DENSE MODEL · SAME GPU · SAME QUANT</text>
    <text x="600" y="84" text-anchor="middle" font-size="13" fill="#94a3b8">Qwen 3.8 27B — the only thing that changed is whether the MTP head gets to speculate</text>

    <!-- source model card -->
    <rect x="120" y="128" width="190" height="112" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="215" y="156" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#67e8f9">DENSE</text>
    <text x="215" y="184" text-anchor="middle" font-size="19" font-weight="800" fill="#f8fafc">QWEN 3.8 27B</text>
    <text x="215" y="206" text-anchor="middle" font-size="10" fill="#94a3b8">Q8 · 99/99 LAYERS GPU</text>

    <!-- branch lines -->
    <line x1="310" y1="168" x2="370" y2="150" stroke="#475569" stroke-width="1.5"/>
    <line x1="310" y1="192" x2="370" y2="256" stroke="#22d3ee" stroke-width="2"/>

    <!-- no-MTP bar (baseline) -->
    <rect x="370" y="128" width="500" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
    <rect x="378" y="136" width="42" height="28" rx="3" fill="#1e293b"/>
    <text x="399" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">7.4</text>
    <text x="432" y="155" font-size="13" fill="#cbd5e1">t/s · no speculation</text>
    <text x="862" y="155" text-anchor="end" font-size="12" fill="#64748b">← the 200 GB/s LPDDR5X wall</text>

    <!-- MTP bar (the win) -->
    <rect x="370" y="232" width="500" height="48" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".6" stroke-width="2"/>
    <rect x="378" y="240" width="455" height="32" rx="4" fill="#083344"/>
    <text x="390" y="262" font-size="14" font-weight="700" fill="#67e8f9">22.35 t/s · MTP</text>
    <text x="862" y="262" text-anchor="end" font-size="11" fill="#94a3b8">structured peak</text>
    <text x="370" y="300" font-size="11" fill="#94a3b8">MTP head drafts K tokens, main model verifies all K in one pass · ~10 t/s sustained on mixed traffic</text>

    <text x="600" y="352" text-anchor="middle" font-size="12" fill="#64748b">Honest limitation: self-speculation only pays off when the draft head is right —</text>
    <text x="600" y="372" text-anchor="middle" font-size="12" fill="#64748b">structured, tool-heavy prompts accept at 80%+; free-form creative drops to ~50%. Bandwidth-bound either way.</text>

    <text x="600" y="410" text-anchor="middle" font-size="11" fill="#64748b">3 parallel slots · 196k context each · nothing rented</text>
  </g>
</svg>
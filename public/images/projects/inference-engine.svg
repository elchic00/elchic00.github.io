<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="ie-title ie-desc">
  <title id="ie-title">Inference Engine — generation speed across two local models</title>
  <desc id="ie-desc">Bar chart comparing real generation throughput of two locally-served models on the same GPU: a 35B mixture-of-experts model at 35 tokens/sec (3B active parameters per token) versus a 27B dense model with speculative decoding at 12 tokens/sec (27B active parameters per token) — smaller model, more active params per token, bandwidth-bound.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- eyebrow badges -->
    <rect x="48" y="40" width="352" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="224" y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#67e8f9">GFX1151 &#183; LLAMA.CPP (PATCHED)</text>
    <text x="1152" y="60" text-anchor="end" font-size="12" letter-spacing="1" fill="#64748b">FRAMEWORK DESKTOP &#8212; RYZEN AI MAX+ 395</text>

    <!-- chart title -->
    <text x="600" y="115" text-anchor="middle" font-size="14" letter-spacing="2" fill="#94a3b8">GENERATION SPEED &#8212; TWO MODELS, SAME GPU</text>

    <!-- baseline -->
    <line x1="60" y1="330" x2="1140" y2="330" stroke="#1e293b" stroke-width="1"/>

    <!-- bar A: 35B-A3B MoE -->
    <rect x="430" y="160" width="110" height="170" fill="url(#barB)" rx="4"/>
    <text x="485" y="145" text-anchor="middle" font-size="26" font-weight="800" fill="#67e8f9">35 t/s</text>
    <text x="485" y="352" text-anchor="middle" font-size="11" letter-spacing="1" fill="#94a3b8">QWEN 35B-A3B</text>
    <text x="485" y="367" text-anchor="middle" font-size="11" letter-spacing="1" fill="#94a3b8">(MOE, 3B ACTIVE/TOKEN)</text>

    <!-- bar B: 27B dense + MTP -->
    <rect x="650" y="272" width="110" height="58" fill="url(#barA)" rx="4"/>
    <text x="705" y="257" text-anchor="middle" font-size="20" font-weight="700" fill="#fbbf24">12 t/s</text>
    <text x="705" y="352" text-anchor="middle" font-size="11" letter-spacing="1" fill="#64748b">QWEN 27B + MTP</text>
    <text x="705" y="367" text-anchor="middle" font-size="11" letter-spacing="1" fill="#64748b">(DENSE, 27B ACTIVE/TOKEN)</text>

    <text x="600" y="393" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">bandwidth-bound: fewer active params per token wins, not fewer total params</text>
  </g>
</svg>

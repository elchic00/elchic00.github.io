<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="ie-title ie-desc">
  <title id="ie-title">Inference Engine: two speculative draft paths past the memory wall</title>
  <desc id="ie-desc">One dense Qwen 3.8 27B model (Q8, full 99-layer GPU offload) on a single AMD APU. The speculative draft path is the only variable. Plain autoregressive decode is pinned at the 7.4 tokens-per-second LPDDR5X memory-bandwidth ceiling. Qwen's own Multi-Token Prediction head, drafting one token at a time, lifts structured tool-calling generation to about 22.4 tokens per second. Swapping to DFlash2, a block-diffusion drafter that proposes a full 8-token block per step and keeps the 3 to 5 the main model verifies (about 75 percent acceptance), reaches about 33 tokens per second on structured and reasoning output, verified lossless against greedy decode. Free-form prose is a wash at roughly 15 tokens per second either way. Three parallel slots, 196k context each.</desc>

  <defs>
    <linearGradient id="bgIE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="gridIE" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glowIE" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgIE)"/>
  <rect width="1200" height="750" fill="url(#gridIE)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- eyebrow badges -->
    <rect x="140" y="40" width="360" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="320" y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#67e8f9">DENSE &#183; QWEN 3.8 27B &#183; Q8</text>
    <rect x="700" y="40" width="360" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="880" y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#6ee7b7">99/99 LAYERS ON GPU &#183; $0 / CALL</text>

    <!-- title -->
    <text x="600" y="116" text-anchor="middle" font-size="15" letter-spacing="1.5" fill="#94a3b8">SPECULATIVE DECODING &#8212; TWO DRAFT PATHS PAST THE BANDWIDTH WALL</text>

    <!-- bar 1: plain decode -->
    <rect x="140" y="150" width="920" height="60" rx="7" fill="#0f172a" stroke="#334155"/>
    <rect x="148" y="158" width="194" height="44" rx="4" fill="#1e293b"/>
    <text x="168" y="189" font-size="26" font-weight="800" fill="#94a3b8">7.4 t/s</text>
    <text x="372" y="185" font-size="13" fill="#64748b">PLAIN DECODE</text>
    <text x="372" y="202" font-size="11" fill="#475569">no draft &#8212; pinned to ~200 GB/s LPDDR5X</text>

    <!-- bar 2: MTP head -->
    <rect x="140" y="232" width="920" height="68" rx="7" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="148" y="240" width="595" height="52" rx="4" fill="#083344"/>
    <text x="168" y="274" font-size="30" font-weight="800" fill="#67e8f9">22.4 t/s</text>
    <text x="763" y="270" font-size="13" fill="#cbd5e1">MTP HEAD</text>
    <text x="763" y="287" font-size="11" fill="#94a3b8">drafts 1 next-token guess</text>

    <!-- bar 3: DFlash2 -->
    <rect x="140" y="322" width="920" height="82" rx="7" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
    <rect x="148" y="330" width="904" height="66" rx="4" fill="#064e3b" filter="url(#glowIE)"/>
    <text x="168" y="374" font-size="38" font-weight="800" fill="#6ee7b7">33 t/s</text>
    <text x="1036" y="360" text-anchor="end" font-size="14" font-weight="700" fill="#a7f3d0">DFLASH2 &#183; +48%</text>
    <text x="1036" y="380" text-anchor="end" font-size="11" fill="#a7f3d0">drafts a full 8-token block per step</text>

    <!-- the wall both speculative paths punch through -->
    <line x1="342" y1="134" x2="342" y2="420" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/>
    <text x="342" y="440" text-anchor="middle" font-size="12" fill="#94a3b8">7.4 t/s ceiling</text>

    <!-- how / caveat -->
    <text x="600" y="486" text-anchor="middle" font-size="13" fill="#94a3b8">DFlash2 drafts a block, the 27B verifies it in one forward pass, keeps the 3&#8211;5 it agrees with (~75%) &#8212; lossless vs greedy.</text>
    <text x="600" y="510" text-anchor="middle" font-size="12" fill="#64748b">Free-form prose is a wash (~15 t/s). Structured, tool-heavy work is the win &#8212; and it's most of the workload.</text>
    <text x="600" y="540" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">3 parallel slots &#183; 196k context each &#183; one box &#183; nothing rented</text>
  </g>
</svg>

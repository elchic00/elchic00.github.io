<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="pc-t pc-d">
  <title id="pc-t">Pi-Cloud — the firewall said 0 of 23 exposed; an outside probe reached 15</title>
  <desc id="pc-d">Twenty-three self-hosted services on a Raspberry Pi 5. The local firewall status reported zero exposed. A probe from off-network reached 15 of the 23, shown as a row of tiles with 15 lit. All 15 were closed and re-checked from outside.</desc>
  <defs><linearGradient id="pcBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#15110a"/></linearGradient></defs>
  <rect width="700" height="400" fill="url(#pcBg)"/>
  <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="2" fill="#a88a4c">EXPOSURE AUDIT · 23 SERVICES</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="40" y="112" font-size="22" fill="#9a907c">firewall status</text>
    <rect x="218" y="86" width="210" height="38" rx="19" fill="#16a34a" fill-opacity=".15" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.5"/>
    <text x="323" y="112" font-size="21" fill="#86efac" text-anchor="middle">✓ 0 of 23 exposed</text>

    <text x="40" y="170" font-size="22" fill="#9a907c">probe from off-network</text>
    <g fill="#fbbf24">
      <rect x="40" y="188" width="42" height="42" rx="7"/><rect x="92" y="188" width="42" height="42" rx="7"/><rect x="144" y="188" width="42" height="42" rx="7"/><rect x="196" y="188" width="42" height="42" rx="7"/><rect x="248" y="188" width="42" height="42" rx="7"/><rect x="300" y="188" width="42" height="42" rx="7"/><rect x="352" y="188" width="42" height="42" rx="7"/><rect x="404" y="188" width="42" height="42" rx="7"/><rect x="456" y="188" width="42" height="42" rx="7"/><rect x="508" y="188" width="42" height="42" rx="7"/><rect x="560" y="188" width="42" height="42" rx="7"/><rect x="612" y="188" width="42" height="42" rx="7"/>
      <rect x="40" y="240" width="42" height="42" rx="7"/><rect x="92" y="240" width="42" height="42" rx="7"/><rect x="144" y="240" width="42" height="42" rx="7"/>
    </g>
    <g fill="none" stroke="#4e3f1c" stroke-width="2">
      <rect x="196" y="240" width="42" height="42" rx="7"/><rect x="248" y="240" width="42" height="42" rx="7"/><rect x="300" y="240" width="42" height="42" rx="7"/><rect x="352" y="240" width="42" height="42" rx="7"/><rect x="404" y="240" width="42" height="42" rx="7"/><rect x="456" y="240" width="42" height="42" rx="7"/><rect x="508" y="240" width="42" height="42" rx="7"/><rect x="560" y="240" width="42" height="42" rx="7"/>
    </g>

    <text x="36" y="360" font-size="64" font-weight="800" letter-spacing="-2" fill="#fde047">15</text>
    <text x="126" y="338" font-size="22" fill="#f5cf6a">reachable from outside</text>
    <text x="126" y="364" font-size="20" fill="#8a7d5c">all closed, re-checked off-network</text>
  </g>
</svg>

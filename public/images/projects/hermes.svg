<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="hm-t hm-d">
  <title id="hm-t">Hermes — the eval judge caught 2 of 5 real failures, kappa 0.09</title>
  <desc id="hm-d">A confusion matrix of the production 27B judge against 63 blind-labeled traces: it caught 2 real failures, missed 3, raised 13 false alarms, and agreed on 45 clean turns. Cohen's kappa 0.09, near chance at catching failures, so a human still approves every prompt edit.</desc>
  <defs><linearGradient id="hmBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#0e0b22"/></linearGradient></defs>
  <rect width="700" height="400" fill="url(#hmBg)"/>
  <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="2" fill="#8b7cc0">EVAL JUDGE vs BLIND LABELS · 63 TRACES</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" text-anchor="middle">
    <text x="190" y="100" font-size="21" fill="#9a94bd">real failure</text>
    <text x="330" y="100" font-size="21" fill="#9a94bd">clean</text>
    <text x="112" y="172" font-size="21" fill="#9a94bd" text-anchor="end">flagged</text>
    <text x="112" y="292" font-size="21" fill="#9a94bd" text-anchor="end">passed</text>

    <rect x="124" y="116" width="132" height="108" rx="10" fill="#a78bfa"/>
    <text x="190" y="176" font-size="48" font-weight="800" fill="#160f33">2</text>
    <text x="190" y="206" font-size="20" fill="#2e2260">caught</text>

    <rect x="264" y="116" width="132" height="108" rx="10" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2"/>
    <text x="330" y="176" font-size="48" font-weight="800" fill="#fcd34d">13</text>
    <text x="330" y="206" font-size="20" fill="#e7c36a">false alarms</text>

    <rect x="124" y="232" width="132" height="108" rx="10" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".75" stroke-width="2"/>
    <text x="190" y="292" font-size="48" font-weight="800" fill="#fca5a5">3</text>
    <text x="190" y="322" font-size="20" fill="#f2a0a0">missed</text>

    <rect x="264" y="232" width="132" height="108" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#2c2750" stroke-width="2"/>
    <text x="330" y="292" font-size="48" font-weight="800" fill="#6f6a96">45</text>
    <text x="330" y="322" font-size="20" fill="#6f6a96">agreed</text>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="436" y="196" font-size="72" font-weight="800" letter-spacing="-2" fill="#c4b5fd">κ 0.09</text>
    <text x="440" y="236" font-size="23" fill="#b3a6e0">near chance at</text>
    <text x="440" y="264" font-size="23" fill="#b3a6e0">catching failures</text>
    <text x="440" y="324" font-size="20" fill="#7d77a3">a human still approves</text>
    <text x="440" y="350" font-size="20" fill="#7d77a3">every prompt edit</text>
  </g>
</svg>

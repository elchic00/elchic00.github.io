<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="jobfit-title jobfit-desc">
  <title id="jobfit-title">Job-Fit Scorer — LangGraph scoring pipeline</title>
  <desc id="jobfit-desc">Flow diagram of the job-fit scoring pipeline: nightly discovery polls 13 companies' ATS boards, thousands of raw postings are filtered to a prioritized queue, each role fans out into parallel requirement-level scoring nodes via LangGraph's Send API, and compiled fit reports sync into the live job-search tracker.</desc>

  <defs>
    <linearGradient id="bgJ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="gridJ" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="arrJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bgJ)"/>
  <rect width="1200" height="750" fill="url(#gridJ)"/>

  <text x="60" y="80" fill="#f8fafc" font-family="Poppins, system-ui, sans-serif" font-size="34" font-weight="800">Job-Fit Scorer</text>
  <text x="60" y="114" fill="#94a3b8" font-family="Poppins, system-ui, sans-serif" font-size="18">LangGraph pipeline · discover → filter → parallel score → sync</text>

  <!-- Stage 1: discover -->
  <g font-family="Poppins, system-ui, sans-serif">
    <rect x="60" y="180" width="240" height="130" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="80" y="215" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="2">DISCOVER</text>
    <text x="80" y="245" fill="#e2e8f0" font-size="16">13 companies' ATS</text>
    <text x="80" y="268" fill="#e2e8f0" font-size="16">boards polled nightly</text>
    <text x="80" y="294" fill="#64748b" font-size="13">Greenhouse · Ashby · Lever</text>

    <line x1="300" y1="245" x2="360" y2="245" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrJ)"/>

    <!-- Stage 2: filter -->
    <rect x="365" y="180" width="240" height="130" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="215" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="2">FILTER</text>
    <text x="385" y="245" fill="#e2e8f0" font-size="16">3,126 raw postings</text>
    <text x="385" y="268" fill="#e2e8f0" font-size="16">→ 56 relevant roles</text>
    <text x="385" y="294" fill="#64748b" font-size="13">dedupe · location · relevance</text>

    <line x1="605" y1="245" x2="665" y2="245" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrJ)"/>

    <!-- Stage 3: parallel scoring fan-out -->
    <rect x="670" y="150" width="470" height="330" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity="0.95"/>
    <text x="690" y="185" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="2">SCORE · LANGGRAPH SEND FAN-OUT</text>

    <rect x="690" y="205" width="200" height="52" rx="10" fill="#1e293b"/>
    <text x="705" y="237" fill="#e2e8f0" font-size="14">requirement 1 → 62/100</text>
    <rect x="690" y="267" width="200" height="52" rx="10" fill="#1e293b"/>
    <text x="705" y="299" fill="#e2e8f0" font-size="14">requirement 2 → 88/100</text>
    <rect x="690" y="329" width="200" height="52" rx="10" fill="#1e293b"/>
    <text x="705" y="361" fill="#e2e8f0" font-size="14">requirement N → 74/100</text>

    <line x1="890" y1="231" x2="940" y2="290" stroke="#475569" stroke-width="1.5"/>
    <line x1="890" y1="293" x2="940" y2="300" stroke="#475569" stroke-width="1.5"/>
    <line x1="890" y1="355" x2="940" y2="310" stroke="#475569" stroke-width="1.5"/>

    <rect x="945" y="265" width="175" height="70" rx="10" fill="#164e63"/>
    <text x="965" y="295" fill="#a5f3fc" font-size="14" font-weight="700">fit 90 · priority 78</text>
    <text x="965" y="318" fill="#67e8f9" font-size="13">recommendation: apply</text>

    <text x="690" y="430" fill="#64748b" font-size="13">honest scoring — calibrated against documented gaps,</text>
    <text x="690" y="452" fill="#64748b" font-size="13">not tuned to flatter · every run traced in Langfuse</text>
  </g>

  <!-- Stage 4: sync -->
  <g font-family="Poppins, system-ui, sans-serif">
    <line x1="905" y1="480" x2="905" y2="540" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrJ)"/>
    <rect x="670" y="545" width="470" height="120" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="690" y="580" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="2">SYNC</text>
    <text x="690" y="610" fill="#e2e8f0" font-size="16">Prioritized queue feeds the live job-search tracker —</text>
    <text x="690" y="634" fill="#e2e8f0" font-size="16">the same one interviews are run from.</text>
  </g>

  <!-- footer stats -->
  <g font-family="Poppins, system-ui, sans-serif">
    <text x="60" y="560" fill="#f8fafc" font-size="26" font-weight="800">76% fewer LLM calls</text>
    <text x="60" y="586" fill="#64748b" font-size="13">per scoring run after the batching redesign</text>
    <text x="60" y="640" fill="#f8fafc" font-size="26" font-weight="800">263 passing tests</text>
    <text x="60" y="666" fill="#64748b" font-size="13">incl. live assertions that every ATS board is alive</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="jf-t jf-d">
  <title id="jf-t">Job-Fit Scorer — one real week: 21 postings scored, 2 worth applying to</title>
  <desc id="jf-d">A LangGraph pipeline scores job postings against an evidence document of what the candidate has actually built, tuned to say no as readily as yes. In one real week 21 postings reached the scorer; 2 were flagged apply or referral-first and 19 were skipped, shown as a split bar. The most common blocker — Spark and distributed computing — hit 7 of the 21. Every rejection logs its reason.</desc>
  <defs>
    <linearGradient id="jfBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#08160f"/></linearGradient>
    <pattern id="jfScan" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="1" fill="#ffffff" opacity="0.02"/></pattern>
    <filter id="jfGlow" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#jfBg)"/>
  <rect width="1200" height="720" fill="url(#jfScan)"/>
  <g font-family="'SF Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="118" y="58" font-size="20" letter-spacing="2.5" fill="#5f9a80">SCORING &#183; ONE REAL WEEK (2026-W30)</text>
    <text x="1082" y="58" text-anchor="end" font-size="19" fill="#3c4d44">mac-mini : jobfit</text>
    <line x1="118" y1="82" x2="1082" y2="82" stroke="#143a2c" stroke-width="1"/>

    <text x="120" y="150" font-size="23" fill="#8fb3a4">21 postings reached the scorer. It is tuned to say no.</text>

    <rect x="118" y="188" width="964" height="62" rx="8" fill="#1a4536"/>
    <rect x="118" y="188" width="92" height="62" rx="8" fill="#34d399"/>
    <text x="122" y="300" font-size="21" fill="#6ee7b7">2 apply / referral</text>
    <text x="560" y="300" font-size="21" fill="#6f9284">19 skipped</text>

    <text x="118" y="470" font-size="120" font-weight="800" letter-spacing="-4" fill="#6ee7b7" filter="url(#jfGlow)">2<tspan font-size="46" font-weight="700" fill="#5f7a6f"> / 21 apply</tspan></text>

    <text x="120" y="518" font-size="22" fill="#7fd8b8">every no logs its reason &#8212; the rejections double as a study list</text>

    <text x="120" y="600" font-size="18" fill="#37564a"># top blocker: Spark / distributed computing &#8212; 7 of 21 postings</text>
  </g>
</svg>

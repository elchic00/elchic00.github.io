<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="jf-t jf-d">
  <title id="jf-t">Job-Fit Scorer — one real week: 21 postings scored, 2 worth applying to</title>
  <desc id="jf-d">A flow diagram of one real week, 2026-W30. Twenty-one postings reached the scorer; 2 flowed to apply or referral-first and 19 to skip. Every skip logs its reason; the most common blocker, Spark and distributed computing, appeared on 7 of the 21.</desc>
  <defs><linearGradient id="jfBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a15"/><stop offset="1" stop-color="#07160f"/></linearGradient></defs>
  <rect width="700" height="400" fill="url(#jfBg)"/>
  <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" letter-spacing="2" fill="#5fa084">ONE REAL WEEK · 2026-W30</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <path d="M190 104h160v22h-160z" fill="#34d399" fill-opacity=".55"/>
    <path d="M190 126C270 126 270 146 350 146V355C270 355 270 335 190 335Z" fill="#1d4a3a" fill-opacity=".8"/>
    <rect x="172" y="104" width="18" height="231" rx="3" fill="#8fb3a4"/>
    <rect x="350" y="104" width="18" height="22" rx="3" fill="#34d399"/>
    <rect x="350" y="146" width="18" height="209" rx="3" fill="#2f6b55"/>

    <text x="152" y="222" font-size="64" font-weight="800" letter-spacing="-2" fill="#d1fae5" text-anchor="end">21</text>
    <text x="152" y="252" font-size="21" fill="#8fb3a4" text-anchor="end">scored</text>

    <text x="388" y="126" font-size="30" font-weight="800" fill="#6ee7b7">2 <tspan font-size="22" font-weight="400">apply</tspan></text>
    <text x="388" y="232" font-size="30" font-weight="800" fill="#7fa596">19 <tspan font-size="22" font-weight="400">skip</tspan></text>
    <text x="388" y="266" font-size="20" fill="#6f9284">each with a logged reason</text>
    <text x="388" y="294" font-size="20" fill="#6f9284">top blocker: Spark, 7 of 21</text>
  </g>
</svg>

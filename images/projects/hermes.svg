<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="hermes-title hermes-desc">
  <title id="hermes-title">Hermes self-improvement loop — one real verified run</title>
  <desc id="hermes-desc">Flow diagram of a weekly self-improvement run: 11 conversation turns scored below quality threshold over 30 days were grouped into 3 clusters by an LLM, producing 3 proposed edits to the agent's system prompt sent to Telegram for approval. Of those, 2 were applied (lead with the answer; complete every action chain) and 1 was correctly rejected as a bad fit for automated cron-only deliveries.</desc>

  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="gridH" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bgH)"/>
  <rect width="1200" height="750" fill="url(#gridH)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- eyebrow badges -->
    <rect x="48" y="40" width="330" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="213" y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#67e8f9">WEEKLY CRON &#183; QWEN-27B JUDGE</text>
    <rect x="822" y="40" width="330" height="34" rx="17" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.35"/>
    <text x="987" y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#fbbf24">NOTHING AUTO-APPLIES</text>

    <!-- title -->
    <text x="600" y="118" text-anchor="middle" font-size="14" letter-spacing="2" fill="#94a3b8">SELF-IMPROVEMENT LOOP &#8212; ONE REAL RUN, VERIFIED</text>

    <!-- Box 1 -->
    <rect x="40" y="200" width="220" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="150" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#e2e8f0">11</text>
    <text x="150" y="260" text-anchor="middle" font-size="11" fill="#94a3b8">LOW-QUALITY TURNS</text>
    <text x="150" y="275" text-anchor="middle" font-size="10" fill="#64748b">score &lt; 3.5, 30 days</text>

    <line x1="260" y1="245" x2="305" y2="245" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="305,245 295,240 295,250" fill="#22d3ee"/>

    <!-- Box 2 -->
    <rect x="310" y="200" width="190" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="405" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#e2e8f0">3</text>
    <text x="405" y="260" text-anchor="middle" font-size="11" fill="#94a3b8">CLUSTERS</text>
    <text x="405" y="275" text-anchor="middle" font-size="10" fill="#64748b">grouped by theme</text>

    <line x1="500" y1="245" x2="545" y2="245" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="545,245 535,240 535,250" fill="#22d3ee"/>

    <!-- Box 3 -->
    <rect x="550" y="200" width="230" height="90" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="665" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#67e8f9">3</text>
    <text x="665" y="260" text-anchor="middle" font-size="11" fill="#94a3b8">PROPOSALS</text>
    <text x="665" y="275" text-anchor="middle" font-size="10" fill="#64748b">SOUL.md patches &#8594; Telegram</text>

    <!-- fork -->
    <line x1="780" y1="245" x2="820" y2="195" stroke="#34d399" stroke-width="2"/>
    <polygon points="820,195 808,196 813,206" fill="#34d399"/>
    <line x1="780" y1="245" x2="820" y2="295" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="820,295 808,294 813,284" fill="#fbbf24"/>

    <!-- Box 4a: applied -->
    <rect x="825" y="160" width="335" height="70" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="845" y="184" font-size="15" font-weight="800" fill="#34d399">2 APPLIED</text>
    <text x="845" y="202" font-size="10" fill="#94a3b8">&#8220;lead with the answer&#8221;</text>
    <text x="845" y="216" font-size="10" fill="#94a3b8">&#8220;complete every action chain&#8221;</text>

    <!-- Box 4b: skipped -->
    <rect x="825" y="260" width="335" height="70" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="845" y="284" font-size="15" font-weight="800" fill="#fbbf24">1 SKIPPED</text>
    <text x="845" y="302" font-size="10" fill="#94a3b8">wrong fit for one-shot cron</text>
    <text x="845" y="316" font-size="10" fill="#94a3b8">deliveries &#8212; correctly rejected</text>

    <text x="600" y="380" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">Nightly scoring, weekly clustering, human approval before anything changes</text>
  </g>
</svg>
